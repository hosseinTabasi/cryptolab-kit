[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cryptolab-kit"
version = "0.1.0"
description = "Educational and practical cryptography toolkit: textbook ciphers plus AES-GCM, RSA-OAEP/PSS, Ed25519, X25519, and hybrid envelopes."
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Hossein Tabasi"},
]
requires-python = ">=3.11"
keywords = [
    "cryptography",
    "aes-gcm",
    "rsa",
    "ed25519",
    "hybrid-encryption",
    "educational",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Education",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security :: Cryptography",
    "Typing :: Typed",
]
dependencies = [
    "cryptography>=42.0.0",
    "argon2-cffi>=23.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.urls]
Homepage = "https://github.com/hosseinTabasi/cryptolab-kit"
Issues = "https://github.com/hosseinTabasi/cryptolab-kit/issues"

[project.scripts]
cryptolab = "cryptolab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
